<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino - Roulette</title>
    <style>
        :root {
            --bg-dark: #121318;
            --card-bg: #1a1c23;
            --accent-red: #d63031;
            --accent-green: #00b894;
            --accent-black: #2d3436;
            --accent-gold: #fdcb6e;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .balance {
            font-size: 1.4rem;
            color: var(--accent-green);
            font-weight: bold;
        }

        /* EKRAN LOGOWANIA */
        .login-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            margin: 100px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        input[type="text"], input[type="number"] {
            width: 80%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #090a0f;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
        }

        button {
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            background: #0984e3;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* BANER INFORMACYJNY */
        .timer-banner {
            text-align: center;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        /* HISTORIA NUMERÓW */
        .history-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* SUWAK RULETKI (TASIEMKA) */
        .roulette-slider-wrapper {
            position: relative;
            width: 100%;
            height: 90px;
            background: #090a0f;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #2d3436;
            margin-bottom: 25px;
        }

        .roulette-pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: var(--accent-gold);
            z-index: 10;
            box-shadow: 0 0 10px var(--accent-gold);
        }

        .roulette-tape {
            display: flex;
            position: absolute;
            left: 0;
            top: 10px;
            height: 70px;
            transition: transform 5s cubic-bezier(0.1, 0.9, 0.1, 1);
        }

        .hex-card {
            min-width: 65px;
            height: 70px;
            margin: 0 4px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .bg-red { background: var(--accent-red); }
        .bg-green { background: var(--accent-green); }
        .bg-black { background: var(--accent-black); }

        /* PANEL ZAKŁADÓW I PRZYCISKI */
        .bet-controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .quick-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn-quick {
            background: #2d3436;
            padding: 8px 14px;
            font-size: 0.9rem;
        }

        /* KOLUMNY ZAKŁADÓW */
        .bet-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .bet-column {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
        }

        .btn-bet-action {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .btn-red { background: var(--accent-red); }
        .btn-green { background: var(--accent-green); }
        .btn-black { background: var(--accent-black); }

        .bet-list {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }

        .bet-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            background: #090a0f;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        /* PANEL ADMINA */
        .admin-box {
            background: #1e1b10;
            border: 2px solid var(--accent-gold);
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .admin-table th, .admin-table td {
            padding: 10px;
            border: 1px solid #333;
            text-align: left;
        }

        .log-area {
            background: #000;
            color: #00ff00;
            font-family: monospace;
            padding: 10px;
            height: 120px;
            overflow-y: scroll;
            border-radius: 5px;
            margin-top: 10px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- LOGOWANIE -->
<div id="login-screen" class="login-box">
    <h2>Wejdź do Kasyna</h2>
    <input type="text" id="nick-input" placeholder="Twój Nick...">
    <button onclick="login()">Graj</button>
</div>

<!-- GŁÓWNA GRA -->
<div id="game-screen" class="container hidden">
    <div class="header">
        <div>Zalogowany jako: <strong id="user-nick"></strong></div>
        <div class="balance">Saldo: $<span id="user-balance">0</span></div>
    </div>

    <!-- BANER ODLICZANIA -->
    <div class="timer-banner">
        Czas do następnego losowania: <strong id="timer-text" style="color: var(--accent-gold);">15.00 sek</strong>
    </div>

    <!-- HISTORIA WYNIKÓW -->
    <div class="history-bar" id="history-bar"></div>

    <!-- SUWAK ANIMACJI RULETKI -->
    <div class="roulette-slider-wrapper">
        <div class="roulette-pointer"></div>
        <div id="roulette-tape" class="roulette-tape"></div>
    </div>

    <!-- STAWIANIE ZAKŁADU -->
    <div class="bet-controls">
        <div style="text-align: center;">
            <input type="number" id="bet-amount" value="1000" min="1">
            <div class="quick-buttons">
                <button class="btn-quick" onclick="addBet(1000)">+1k</button>
                <button class="btn-quick" onclick="addBet(10000)">+10k</button>
                <button class="btn-quick" onclick="addBet(100000)">+100k</button>
                <button class="btn-quick" onclick="multiplyBet(0.5)">1/2</button>
                <button class="btn-quick" onclick="multiplyBet(2)">x2</button>
                <button class="btn-quick" onclick="clearBet()">Wyczyść</button>
            </div>
        </div>
    </div>

    <!-- TRZY KOLUMNY ZAKŁADÓW -->
    <div class="bet-grid">
        <div class="bet-column">
            <button class="btn-bet-action btn-red" onclick="placeBet('red')">Czerwone x2</button>
            <ul class="bet-list" id="bets-red"></ul>
        </div>
        <div class="bet-column">
            <button class="btn-bet-action btn-green" onclick="placeBet('green')">Zielone x7</button>
            <ul class="bet-list" id="bets-green"></ul>
        </div>
        <div class="bet-column">
            <button class="btn-bet-action btn-black" onclick="placeBet('black')">Czarny x2</button>
            <ul class="bet-list" id="bets-black"></ul>
        </div>
    </div>

    <!-- PANEL ADMINA -->
    <div id="admin-panel" class="admin-box hidden">
        <h3 style="color: var(--accent-gold); margin-top:0;">👑 Panel Administratora</h3>
        
        <div>
            <h4>Ustaw następny wynik ruletki:</h4>
            <input type="number" id="admin-force-num" placeholder="Liczba 0-14" min="0" max="14" style="width: 150px;">
            <button onclick="forceResult()">Ustaw wynik</button>
        </div>

        <h4>Gracze online:</h4>
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Nick</th>
                    <th>Saldo</th>
                    <th>IP</th>
                    <th>Akcja</th>
                </tr>
            </thead>
            <tbody id="admin-players-body"></tbody>
        </table>

        <h4>Logi serwera:</h4>
        <div class="log-area" id="admin-logs"></div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let myNick = '';
    let myBalance = 0;

    const reds = [1,2,3,4,5,6,7];
    const sequence = [1, 14, 2, 13, 3, 12, 4, 0, 11, 5, 10, 6, 9, 7, 8];

    function login() {
        const nick = document.getElementById('nick-input').value;
        if (!nick) return;
        socket.emit('set-nickname', nick);
    }

    socket.on('init-player', (data) => {
        myNick = data.nick;
        myBalance = data.balance;

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');

        document.getElementById('user-nick').innerText = myNick;
        document.getElementById('user-balance').innerText = myBalance.toLocaleString();

        if (data.isAdmin) {
            document.getElementById('admin-panel').classList.remove('hidden');
        }

        renderHistory(data.history);
        buildTape();
    });

    // Zbudowanie taśmy dla slajdera
    function buildTape() {
        const tape = document.getElementById('roulette-tape');
        tape.innerHTML = '';
        
        // Generowanie powtórzonego ciągu cyfr
        for (let i = 0; i < 6; i++) {
            sequence.forEach(num => {
                const card = document.createElement('div');
                let colorClass = num === 0 ? 'bg-green' : (reds.includes(num) ? 'bg-red' : 'bg-black');
                card.className = `hex-card ${colorClass}`;
                card.innerText = num;
                tape.appendChild(card);
            });
        }
    }

    function renderHistory(history) {
        const bar = document.getElementById('history-bar');
        bar.innerHTML = '';
        history.forEach(num => {
            const badge = document.createElement('div');
            let colorClass = num === 0 ? 'bg-green' : (reds.includes(num) ? 'bg-red' : 'bg-black');
            badge.className = `badge ${colorClass}`;
            badge.innerText = num;
            bar.appendChild(badge);
        });
    }

    // Szybkie przyciski
    function addBet(val) {
        const input = document.getElementById('bet-amount');
        input.value = parseInt(input.value || 0) + val;
    }
    function multiplyBet(factor) {
        const input = document.getElementById('bet-amount');
        input.value = Math.floor(parseInt(input.value || 0) * factor);
    }
    function clearBet() {
        document.getElementById('bet-amount').value = 0;
    }

    function placeBet(color) {
        const amount = parseInt(document.getElementById('bet-amount').value);
        if (amount > 0) {
            socket.emit('place-bet', { color, amount });
        }
    }

    socket.on('timer-tick', (time) => {
        document.getElementById('timer-text').innerText = `${time}.00 sek`;
    });

    socket.on('bet-placed', (data) => {
        if (data.nick === myNick) {
            myBalance = data.playerBalance;
            document.getElementById('user-balance').innerText = myBalance.toLocaleString();
        }
        renderBets(data.bets);
    });

    function renderBets(bets) {
        ['red', 'green', 'black'].forEach(color => {
            const list = document.getElementById(`bets-${color}`);
            list.innerHTML = '';
            bets[color].forEach(b => {
                list.innerHTML += `<li class="bet-item"><span>${b.nick}</span> <strong>$${b.amount.toLocaleString()}</strong></li>`;
            });
        });
    }

    socket.on('roulette-spin', (data) => {
        document.getElementById('timer-text').innerText = 'LOSOWANIE...';
        const tape = document.getElementById('roulette-tape');
        
        // Animacja przesunięcia taśmy
        const cardWidth = 73; // min-width + margin
        const targetIndex = sequence.indexOf(data.winningNumber) + (sequence.length * 3);
        const offset = (targetIndex * cardWidth) - (document.querySelector('.roulette-slider-wrapper').offsetWidth / 2) + (cardWidth / 2);

        tape.style.transform = `translateX(-${offset}px)`;
    });

    socket.on('roulette-reset', (data) => {
        const tape = document.getElementById('roulette-tape');
        tape.style.transition = 'none';
        tape.style.transform = 'translateX(0px)';
        setTimeout(() => {
            tape.style.transition = 'transform 5s cubic-bezier(0.1, 0.9, 0.1, 1)';
        }, 50);

        renderHistory(data.history);
        renderBets({ red: [], green: [], black: [] });

        if (data.players[socket.id]) {
            myBalance = data.players[socket.id].balance;
            document.getElementById('user-balance').innerText = myBalance.toLocaleString();
        }
    });

    // ADMIN EVENTS
    socket.on('admin-players-update', (players) => {
        const body = document.getElementById('admin-players-body');
        if (!body) return;
        body.innerHTML = '';
        for (let id in players) {
            const p = players[id];
            body.innerHTML += `
                <tr>
                    <td>${p.nick}</td>
                    <td>$${p.balance.toLocaleString()}</td>
                    <td>${p.ip}</td>
                    <td>
                        <button onclick="changeBalance('${p.nick}')">Edytuj Saldo</button>
                    </td>
                </tr>
            `;
        }
    });

    socket.on('admin-log', (logText) => {
        const logArea = document.getElementById('admin-logs');
        if (logArea) {
            logArea.innerHTML += logText + '<br>';
            logArea.scrollTop = logArea.scrollHeight;
        }
    });

    function changeBalance(nick) {
        const newBal = prompt(`Wpisz nowe saldo dla ${nick}:`);
        if (newBal !== null) {
            socket.emit('admin-set-balance', { nick, balance: newBal });
        }
    }

    function forceResult() {
        const num = document.getElementById('admin-force-num').value;
        if (num !== '') {
            socket.emit('admin-force-result', num);
            alert(`Ustawiono wygraną cyfrę: ${num}`);
        }
    }
</script>
</body>
</html>
